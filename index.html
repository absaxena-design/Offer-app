<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F8F4EC"/>
  <meta name="description" content="ARXA — smarter product price tracking"/>
  <title>ARXA — Track smarter</title>
  <style>
    :root { --fallback-paper: #F8F4EC; --fallback-ink: #28324A; --fallback-oxide: #A34332; --fallback-muted: #526078; }
    body { margin: 0; background: var(--fallback-paper); font-family: system-ui, sans-serif; color: var(--fallback-ink); }
    .startup { max-width: 520px; margin: 12vh auto; padding: 28px; text-align: center; }
    .startup-brand { font-size: 42px; letter-spacing: -2px; }
    .startup-brand-accent { color: var(--fallback-oxide); }
    .startup-status { font-size: 19px; font-weight: 600; }
    .startup-help { line-height: 1.5; color: var(--fallback-muted); }
  </style>
</head>
<body>
  <div id="root">
    <div class="startup">
      <h1 class="startup-brand">arxa<span class="startup-brand-accent">.</span></h1>
      <p id="arxa-status" class="startup-status">ARXA is loading…</p>
      <p id="arxa-help" class="startup-help">Preparing your dashboard.</p>
    </div>
  </div>
  <script>
    (function () {
      function show(status, help) {
        var headline = document.getElementById('arxa-status');
        var text = document.getElementById('arxa-help');
        if (headline) headline.textContent = status;
        if (text) text.textContent = help;
      }
      window.addEventListener('error', function (event) {
        if (!document.querySelector('#root .app')) {
          show('ARXA could not start', event.message || 'A required app file failed to load.');
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (!document.querySelector('#root .app')) {
          show('ARXA could not start', String(event.reason || 'Unexpected startup error'));
        }
      });
      window.addEventListener('load', function () {
        if (document.querySelector('#root .app')) return;
        var appScript = document.querySelector('script[type="module"]');
        var source = appScript && appScript.getAttribute('src') || '';
        if (source.indexOf('/src/main.jsx') !== -1) {
          show('GitHub Pages is serving source files, not the built app.',
            'Fix: Repository Settings → Pages → Build and deployment → Source → GitHub Actions. Then reload this page.');
        } else {
          show('ARXA did not start', 'The app bundle may have been blocked or failed. Check the browser console for details.');
        }
      });
    }());
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
